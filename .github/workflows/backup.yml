name: Weekly backup

# Every Sunday at 23:37 WIB: copy all tables out of Supabase and email them (see scripts/backup.mjs).
# Also run it by hand any time: Actions → Weekly backup → Run workflow.
# Recipient: secret BACKUP_TO (one or more emails, comma separated). Without it, it goes to SMTP_USER.
on:
  schedule:
    - cron: "37 16 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only count the rows, send nothing"
        type: boolean
        default: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund nodemailer@6.9.16
      - run: node scripts/backup.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          BACKUP_TO: ${{ secrets.BACKUP_TO }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
