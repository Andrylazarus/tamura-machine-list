name: Daily task email

# 06:00 WIB every day. Supabase (pg_cron, see supabase/daily-email-cron.sql) starts this job at
# 06:00 sharp. GitHub's own timer below is only a backup at about 06:20, because GitHub sometimes
# skips or delays scheduled jobs. The script sends at most one scheduled email per day.
on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show who would get an email, send nothing"
        type: boolean
        default: true
      scheduled:
        description: "Daily run (skipped if today's email was already sent)"
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-audit --no-fund nodemailer@6.9.16
      - run: node scripts/daily-tasks.mjs
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          REMINDER_CC: ${{ secrets.REMINDER_CC }}
          DUE_SOON_DAYS: "2"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && 'true' || 'false' }}
